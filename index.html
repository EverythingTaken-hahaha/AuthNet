<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AuthNet — QR Verify</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
      color: #fff;
    }

    .subtitle {
      font-size: 0.8rem;
      color: #666;
      margin-bottom: 24px;
    }

    /* ── Camera ── */
    #reader {
      width: 100%;
      max-width: 420px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #2a2a2a;
    }

    /* Override html5-qrcode default white background */
    #reader > * { background: #0f0f0f !important; }

    /* ── Status badge ── */
    #status-bar {
      margin-top: 20px;
      width: 100%;
      max-width: 420px;
      border-radius: 10px;
      padding: 14px 20px;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      transition: background 0.3s;
    }

    .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      background: #444;
    }

    /* ── Result card ── */
    #result-card {
      display: none;
      margin-top: 16px;
      width: 100%;
      max-width: 420px;
      border-radius: 12px;
      padding: 20px 24px;
      border: 2px solid #2a2a2a;
      background: #141414;
    }

    .verdict-label {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #222;
      font-size: 0.82rem;
      color: #aaa;
    }

    .result-row:last-child { border-bottom: none; }
    .result-row span:last-child { color: #eee; font-weight: 500; }

    /* ── Verdict colour themes ── */
    .theme-real    { border-color: #22c55e; }
    .theme-real    .verdict-label { color: #22c55e; }
    .theme-real    .dot            { background: #22c55e; }

    .theme-fake    { border-color: #ef4444; }
    .theme-fake    .verdict-label { color: #ef4444; }
    .theme-fake    .dot            { background: #ef4444; }

    .theme-uncertain { border-color: #f59e0b; }
    .theme-uncertain .verdict-label { color: #f59e0b; }
    .theme-uncertain .dot            { background: #f59e0b; }

    .theme-burned  { border-color: #f97316; }
    .theme-burned  .verdict-label { color: #f97316; }
    .theme-burned  .dot            { background: #f97316; }

    .theme-error   { border-color: #6b7280; }
    .theme-error   .verdict-label { color: #6b7280; }
    .theme-error   .dot            { background: #6b7280; }

    /* ── Scan again button ── */
    #scan-again {
      display: none;
      margin-top: 16px;
      width: 100%;
      max-width: 420px;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: #1e40af;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
    }

    #scan-again:hover { background: #1d4ed8; }

    /* ── API URL config ── */
    #api-config {
      margin-top: 24px;
      font-size: 0.75rem;
      color: #444;
    }

    #api-url-input {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
      color: #888;
      padding: 4px 8px;
      font-size: 0.75rem;
      width: 240px;
      margin-left: 6px;
    }
  </style>
</head>
<body>

  <h1>AuthNet Verify</h1>
  <p class="subtitle">Point camera at a QR code to authenticate</p>

  <div id="reader"></div>

  <div id="status-bar">
    <div class="dot"></div>
    <span id="status-text">Initialising camera…</span>
  </div>

  <div id="result-card">
    <div class="verdict-label" id="verdict-text">—</div>
    <div class="result-row"><span>Confidence</span><span id="res-confidence">—</span></div>
    <div class="result-row"><span>Scan count</span><span id="res-scan-count">—</span></div>
    <div class="result-row"><span>Product ID</span><span id="res-product-id">—</span></div>
  </div>

  <button id="scan-again" onclick="resetScanner()">Scan another code</button>

  <div id="api-config">
    API:
    <input id="api-url-input" type="text" id="api-url-input"
      value="" placeholder="http://192.168.x.x:8000" />
  </div>

  <!-- Hidden canvas used to capture the camera frame -->
  <canvas id="capture-canvas" style="display:none"></canvas>

<script>
  const statusBar  = document.getElementById("status-bar");
  const statusText = document.getElementById("status-text");
  const resultCard = document.getElementById("result-card");
  const scanAgain  = document.getElementById("scan-again");

  let scanner  = null;
  let scanning = true;   // guard against double-fire

  // ── Helpers ────────────────────────────────────────────────────────────────

  function setStatus(text, theme) {
    statusText.textContent = text;
    statusBar.className = "";
    if (theme) statusBar.classList.add(theme);
    // sync the dot colour via the theme class on status-bar
    const dot = statusBar.querySelector(".dot");
    dot.className = "dot";
  }

  function extractProductId(qrText) {
    try {
      const url    = new URL(qrText);
      const idParam = url.searchParams.get("id");
      if (idParam) return idParam;
    } catch (_) { /* not a URL */ }
    // Fallback: treat the raw QR text as the ID
    return qrText.trim();
  }

  function captureFrame() {
    // Grab the live <video> element rendered by html5-qrcode
    const video  = document.querySelector("#reader video");
    const canvas = document.getElementById("capture-canvas");

    if (!video || video.readyState < 2) return null;

    canvas.width  = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0);

    return new Promise(resolve =>
      canvas.toBlob(blob => resolve(blob), "image/png")
    );
  }

  // ── Core verify flow ───────────────────────────────────────────────────────

  async function onQrDetected(qrText) {
    if (!scanning) return;
    scanning = false;   // prevent re-entry while request is in-flight

    const productId = extractProductId(qrText);
    setStatus("QR detected — capturing frame…");

    const imageBlob = await captureFrame();
    if (!imageBlob) {
      setStatus("Could not capture camera frame. Try again.", "theme-error");
      scanning = true;
      return;
    }

    setStatus("Verifying with AuthNet…");

    const apiBase = document.getElementById("api-url-input").value.trim();
    const formData = new FormData();
    formData.append("image",      imageBlob, "scan.png");
    formData.append("product_id", productId);

    let result;
    try {
      const resp = await fetch(`${apiBase}/verify`, {
        method: "POST",
        body:   formData,
      });
      result = await resp.json();
    } catch (err) {
      setStatus(`API unreachable: ${err.message}`, "theme-error");
      scanning = true;
      return;
    }

    showResult(result, productId);
  }

  function showResult(result, productId) {
    const verdict   = result.verdict || "ERROR";
    const themeMap  = {
      REAL:      "theme-real",
      FAKE:      "theme-fake",
      UNCERTAIN: "theme-uncertain",
      BURNED:    "theme-burned",
      INVALID_ID:"theme-error",
      ERROR:     "theme-error",
    };
    const theme = themeMap[verdict] || "theme-error";

    // Status bar
    setStatus(`Verdict: ${verdict}`, theme);

    // Result card
    document.getElementById("verdict-text").textContent    = verdict;
    document.getElementById("res-confidence").textContent  =
      result.confidence != null ? `${(result.confidence * 100).toFixed(1)}%` : "—";
    document.getElementById("res-scan-count").textContent  =
      result.scan_count != null ? result.scan_count : "—";
    document.getElementById("res-product-id").textContent  =
      productId.length > 20 ? productId.slice(0, 8) + "…" + productId.slice(-4) : productId;

    resultCard.className = `${theme}`;
    resultCard.style.display = "block";
    scanAgain.style.display  = "block";
  }

  // ── Scanner lifecycle ──────────────────────────────────────────────────────

  function startScanner() {
    scanning = true;
    resultCard.style.display = "none";
    scanAgain.style.display  = "none";
    setStatus("Camera active — point at a QR code");

    scanner = new Html5Qrcode("reader");
    scanner.start(
      { facingMode: "environment" },   // rear camera on phones / Pi cam
      { fps: 10, qrbox: { width: 280, height: 280 } },
      onQrDetected,
      () => {}   // suppress per-frame decode errors
    ).catch(err => {
      setStatus(`Camera error: ${err}`, "theme-error");
    });
  }

  function resetScanner() {
    if (scanner) {
      scanner.stop().then(() => { scanner = null; startScanner(); }).catch(() => startScanner());
    } else {
      startScanner();
    }
  }

  // API is hosted on Render
  document.getElementById("api-url-input").value = "https://authnet-backend.onrender.com";

  // Always use the live camera scanner regardless of device or URL params.
  // GitHub Pages serves over HTTPS so getUserMedia works on all browsers including mobile.
  // When the QR is detected the frame is captured and verified automatically — no tapping.
  startScanner();
</script>
</body>
</html>
